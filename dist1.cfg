!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname dist1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
no ip domain-lookup
ip domain-name enterprise.local
ip name-server 172.20.21.100
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
username admin privilege 15 secret admin@123
!
redundancy
!
lldp run
!
interface GigabitEthernet0/0
 description mgmt
 ip address 172.20.21.15 255.255.255.0
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description to-core-cisco
 ip address 10.11.0.2 255.255.255.252
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 description to-core-ceos
 ip address 10.20.2.2 255.255.255.252
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 description to-access-cisco1
 ip address 10.11.1.1 255.255.255.252
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/4
 description to-access-ceos2
 ip address 10.11.2.1 255.255.255.252
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/5
 description to-access-veos1
 ip address 10.11.3.1 255.255.255.252
 no shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip routing
!
router ospf 1
 router-id 3.3.3.1
 passive-interface GigabitEthernet0/0
 network 10.11.0.0 0.0.0.3 area 0
 network 10.11.1.0 0.0.0.3 area 0
 network 10.11.2.0 0.0.0.3 area 0
 network 10.11.3.0 0.0.0.3 area 0
 network 10.20.2.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip ssh version 2
!
logging source-interface GigabitEthernet0/0
logging host 172.20.21.1
!
snmp-server community public RO
snmp-server host 172.20.21.1 version 2c public
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config
snmp-server contact admin@enterprise.local
snmp-server location distribution-layer
!
control-plane
!
line con 0
 login local
line vty 0 4
 login local
 transport input ssh
!
ntp server 172.20.21.100
!
