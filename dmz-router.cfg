no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$placeholder$changeme
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging host 172.20.21.1
!
hostname dmz-router
ip name-server vrf default 172.20.21.100
!
snmp-server contact admin@enterprise.local
snmp-server location dmz
snmp-server community public ro
snmp-server host 172.20.21.1 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description to-core-ceos
   no switchport
   ip address 10.20.4.2/30
!
interface Ethernet2
   description to-dmz-sw
   no switchport
   ip address 10.30.1.1/30
!
interface Management0
   ip address 172.20.21.24/24
!
ip routing
!
ntp server 172.20.21.100
!
router ospf 1
   router-id 7.7.7.1
   network 10.20.4.0/30 area 0.0.0.0
   network 10.30.1.0/30 area 0.0.0.0
   max-lsa 12000
!
management ssh
   authentication mode password
!
end
