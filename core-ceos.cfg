no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$placeholder$changeme
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging host 172.20.21.1
!
hostname core-ceos
ip name-server vrf default 172.20.21.100
!
snmp-server contact admin@enterprise.local
snmp-server location core-datacenter
snmp-server community public ro
snmp-server host 172.20.21.1 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description to-vsrx
   no switchport
   ip address 10.20.0.2/30
!
interface Ethernet2
   description to-core-cisco
   no switchport
   ip address 10.10.1.2/30
!
interface Ethernet3
   description to-dist1
   no switchport
   ip address 10.20.2.1/30
!
interface Ethernet4
   description to-dist2
   no switchport
   ip address 10.20.3.1/30
!
interface Ethernet5
   description to-dmz-router
   no switchport
   ip address 10.20.4.1/30
!
interface Management0
   ip address 172.20.21.14/24
!
ip routing
!
ip route 0.0.0.0/0 10.20.0.1
!
ntp server 172.20.21.100
!
router ospf 1
   router-id 2.2.2.2
   network 10.10.1.0/30 area 0.0.0.0
   network 10.20.0.0/30 area 0.0.0.0
   network 10.20.2.0/30 area 0.0.0.0
   network 10.20.3.0/30 area 0.0.0.0
   network 10.20.4.0/30 area 0.0.0.0
   max-lsa 12000
   default-information originate
!
management ssh
   authentication mode password
!
end
