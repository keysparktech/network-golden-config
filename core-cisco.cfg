hostname core-cisco
!
no ip domain-lookup
ip domain-name enterprise.local
ip name-server 172.20.21.100
!
username admin privilege 15 secret admin@123
!
lldp run
!
interface GigabitEthernet0/0
 description mgmt
 ip address 172.20.21.13 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description to-firewall
 ip address 10.10.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description to-core-ceos
 ip address 10.10.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description to-dist1
 ip address 10.11.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description to-dist2
 ip address 10.10.3.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/5
 description to-server-sw
 ip address 10.10.4.1 255.255.255.252
 no shutdown
!
ip routing
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0
 network 10.10.0.0 0.0.0.3 area 0
 network 10.10.1.0 0.0.0.3 area 0
 network 10.11.0.0 0.0.0.3 area 0
 network 10.10.3.0 0.0.0.3 area 0
 network 10.10.4.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip ssh version 2
!
logging source-interface GigabitEthernet0/0
logging host 172.20.21.100
logging trap informational
logging on
!
snmp-server community public RO
snmp-server host 172.20.21.100 version 2c public
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config
snmp-server contact admin@enterprise.local
snmp-server location core-datacenter
!
line con 0
 login local
line vty 0 4
 login local
 transport input ssh
!
ntp server 172.20.21.100
!
end
