config system global
    set hostname firewall
    set timezone 04
end
config system dns
    set primary 172.20.21.100
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server 172.20.21.100
        next
    end
end
config system interface
    edit port1
        set mode dhcp
        set allowaccess ssh https ping snmp
    next
    edit port2
        set description "to-isp"
        set ip 10.0.1.2 255.255.255.252
        set allowaccess ssh https ping snmp
    next
    edit port3
        set description "to-core-cisco"
        set ip 10.10.0.1 255.255.255.252
        set allowaccess ssh https ping snmp
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 10.0.1.1
        set device port2
    next
    edit 2
        set dst 10.10.0.0 255.255.0.0
        set gateway 10.10.0.2
        set device port3
    next
    edit 3
        set dst 10.20.0.0 255.255.0.0
        set gateway 10.10.0.2
        set device port3
    next
    edit 4
        set dst 10.11.0.0 255.255.0.0
        set gateway 10.10.0.2
        set device port3
    next
    edit 5
        set dst 10.12.0.0 255.255.0.0
        set gateway 10.10.0.2
        set device port3
    next
end
config firewall policy
    edit 1
        set name "internal-to-wan"
        set srcintf port3
        set dstintf port2
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
    next
    edit 2
        set name "wan-to-internal"
        set srcintf port2
        set dstintf port3
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
    next
end
config system snmp sysinfo
    set status enable
    set trap-high-cpu-threshold 80
    set trap-low-memory-threshold 20
end
config system snmp community
    edit 1
        set name public
        config hosts
            edit 1
                set ip 172.20.21.100 255.255.255.255
            next
            edit 2
                set ip 0.0.0.0 0.0.0.0
            next
        end
        set events cpu-high mem-low intf-ip vpn-tun-up vpn-tun-down
        set trap-v2c-status enable
    next
end
config log syslogd setting
    set status enable
    set server 172.20.21.100
    set port 514
    set facility local7
    set format default
end
config log syslogd filter
    set severity information
end